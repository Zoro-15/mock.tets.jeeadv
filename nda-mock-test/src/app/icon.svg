<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="40" />
    </clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0b0b" />
      <stop offset="100%" stop-color="#181717" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Outer Circle outline -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-width="4.5" />

  <!-- Inner content clipped to circle -->
  <g clip-path="url(#circleClip)">
    <!-- Left thick boundary line -->
    <line x1="38" y1="0" x2="38" y2="100" stroke="#ffffff" stroke-width="4.5" />
    
    <!-- Right thick boundary line -->
    <line x1="62" y1="0" x2="62" y2="100" stroke="#ffffff" stroke-width="4.5" />

    <!-- Center 3 thin lines -->
    <line x1="45" y1="0" x2="45" y2="100" stroke="#ffffff" stroke-width="2.2" />
    <line x1="50" y1="0" x2="50" y2="100" stroke="#ffffff" stroke-width="2.2" />
    <line x1="55" y1="0" x2="55" y2="100" stroke="#ffffff" stroke-width="2.2" />
  </g>
</svg>
